    <meta charset="UTF-8" />
    <script>
      // Suppress Vite HMR WebSocket connection errors per environment constraints
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function(a) { return String(a && a.stack ? a.stack : a); }).join(' ');
          if (text.includes('[vite]') || text.includes('WebSocket') || text.includes('@vite/client')) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (e && (e.filename && e.filename.indexOf('@vite/client') !== -1 || (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('vite') !== -1)))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = String(e && (e.reason && e.reason.stack ? e.reason.stack : e.reason) || '');
          if (reason.indexOf('@vite/client') !== -1 || reason.indexOf('WebSocket') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
