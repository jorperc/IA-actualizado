<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="8 8" />
  
  <!-- Middle Ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#0284c7" stroke-width="4" opacity="0.6" />
  
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="60" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.8" />

  <!-- Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#475569" stroke-width="3" opacity="0.5" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="#475569" stroke-width="3" opacity="0.5" />

  <!-- Radar Sweep -->
  <path d="M 256 256 L 383 129 A 180 180 0 0 0 256 76 Z" fill="url(#sweep)" />
  <line x1="256" y1="256" x2="383" y2="129" stroke="#38bdf8" stroke-width="4" />

  <!-- Center Node -->
  <circle cx="256" cy="256" r="14" fill="#38bdf8" />
  <circle cx="256" cy="256" r="28" fill="url(#pulse)" />

  <!-- Blips (AI Signals) -->
  <circle cx="340" cy="180" r="8" fill="#ef4444" />
  <circle cx="340" cy="180" r="16" fill="#ef4444" opacity="0.3" />

  <circle cx="180" cy="310" r="7" fill="#10b981" />
  <circle cx="180" cy="310" r="14" fill="#10b981" opacity="0.3" />

  <circle cx="320" cy="330" r="6" fill="#f59e0b" />
</svg>
